<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Southeast Asian History &amp; Civilizations — Interactive Mindmap</title>
<style>
  :root{
    --bg:#f5f7fb;
    --root:#c9cbf3;
    --root-border:#a9abe6;
    --b1:#aec6ec; /* level 1 */
    --b2:#c3d6f2; /* level 2 */
    --b3:#dbe7f8; /* level 3 */
    --leaf:#eef3fb;
    --line:#6f8fd6;
    --text:#12203a;
    --muted:#4a5a76;
    --shadow:0 2px 6px rgba(30,50,90,.14);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:"Segoe UI",Roboto,system-ui,-apple-system,sans-serif;color:var(--text);background:var(--bg);overflow:hidden}

  #toolbar{
    position:fixed;top:0;left:0;right:0;height:52px;z-index:20;
    display:flex;align-items:center;gap:10px;padding:0 16px;
    background:rgba(255,255,255,.9);backdrop-filter:blur(6px);
    border-bottom:1px solid #dce3ef;
  }
  #toolbar h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.2px;white-space:nowrap}
  #toolbar .spacer{flex:1}
  #toolbar button{
    font:inherit;font-size:13px;border:1px solid #c3cfe2;background:#fff;color:var(--muted);
    padding:6px 12px;border-radius:8px;cursor:pointer;transition:.15s;white-space:nowrap;
  }
  #toolbar button:hover{background:#eef3fb;color:var(--text);border-color:#9db4de}
  #hint{font-size:12px;color:#8a99b3;white-space:nowrap}

  #stage{position:absolute;inset:52px 0 0 0;overflow:hidden;cursor:grab}
  #stage.grabbing{cursor:grabbing}
  #world{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
  svg#links{position:absolute;top:0;left:0;overflow:visible;pointer-events:none}
  path.link{fill:none;stroke:var(--line);stroke-width:2;opacity:.55}

  .node{
    position:absolute;transform:translateY(-50%);
    display:flex;align-items:center;gap:8px;
    padding:9px 14px;border-radius:12px;box-shadow:var(--shadow);
    cursor:pointer;user-select:none;line-height:1.25;
    border:1px solid rgba(90,120,180,.25);transition:filter .12s, box-shadow .12s;
  }
  .node:hover{filter:brightness(1.03);box-shadow:0 4px 12px rgba(30,50,90,.22)}
  .node .label{font-weight:500}
  .node .toggle{
    flex:none;width:20px;height:20px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.65);font-size:12px;font-weight:700;color:var(--muted);
  }
  .node.collapsed .toggle{background:var(--line);color:#fff}

  .node.lvl0{background:var(--root);border-color:var(--root-border);font-size:17px;font-weight:700;padding:14px 20px}
  .node.lvl1{background:var(--b1);font-size:15px;font-weight:600}
  .node.lvl2{background:var(--b2);font-size:13.5px}
  .node.lvl3{background:var(--b3);font-size:13px}
  .node.lvl4{background:var(--leaf);font-size:12.5px;color:var(--muted)}

  .node .info{
    display:none;position:absolute;left:0;top:calc(100% + 6px);z-index:30;
    width:max-content;max-width:340px;background:#fff;color:var(--text);
    border:1px solid #cdd8ec;border-radius:10px;padding:10px 12px;font-size:12.5px;font-weight:400;
    box-shadow:0 8px 24px rgba(20,40,80,.18);white-space:normal;line-height:1.45;
  }
  .node.show-info .info{display:block}

  #minZoom{position:fixed;right:16px;bottom:16px;z-index:20;display:flex;gap:6px}
  #minZoom button{width:34px;height:34px;border-radius:9px;border:1px solid #c3cfe2;background:#fff;font-size:17px;cursor:pointer;color:var(--muted)}
  #minZoom button:hover{background:#eef3fb}
  #legend{position:fixed;left:16px;bottom:16px;z-index:20;background:rgba(255,255,255,.9);border:1px solid #dce3ef;border-radius:10px;padding:8px 12px;font-size:11.5px;color:var(--muted);line-height:1.6}
  #legend b{color:var(--text)}
</style>
</head>
<body>
  <div id="toolbar">
    <h1>🗺️ Southeast Asian History &amp; Civilizations</h1>
    <span class="spacer"></span>
    <span id="hint">Click a node to expand · drag to pan · scroll to zoom</span>
    <button id="expandBtn">Expand all</button>
    <button id="collapseBtn">Collapse all</button>
    <button id="resetBtn">Reset view</button>
  </div>

  <div id="stage">
    <div id="world">
      <svg id="links"></svg>
    </div>
  </div>

  <div id="minZoom">
    <button id="zoomOut">−</button>
    <button id="zoomIn">+</button>
    <button id="fit" title="Fit to screen">⤢</button>
  </div>
  <div id="legend">
    Nodes with a <b>+</b> hold more detail. Leaf nodes with underlined dot show a note on click.
  </div>

/* ============================================================
   LAYOUT + RENDER
   ============================================================ */
const stage = document.getElementById('stage');
const world = document.getElementById('world');
const svg   = document.getElementById('links');

const COL_W = 300;      // horizontal spacing per depth
const ROW_H = 46;       // vertical spacing per leaf row
let uid = 0;

/* prepare tree: give ids, collapse deeper levels by default */
function prep(node, depth){
  node._id = uid++;
  node.depth = depth;
  node._collapsed = depth >= 2;   // show root + level 1 + level 2 open, deeper collapsed
  if(node.children) node.children.forEach(c=>prep(c, depth+1));
}
prep(DATA, 0);

let rowCursor = 0;
/* assign layout coords to visible nodes; returns {minY,maxY} */
function layout(node){
  node.x = node.depth * COL_W;
  const kids = (!node._collapsed && node.children) ? node.children : null;
  if(kids && kids.length){
    let first=null, last=null;
    kids.forEach(c=>{ layout(c); if(first===null) first=c.y; last=c.y; });
    node.y = (first + last)/2;
  }else{
    node.y = rowCursor * ROW_H;
    rowCursor++;
  }
}

function collectVisible(node, arr, links, parent){
  arr.push(node);
  if(parent) links.push([parent, node]);
  if(!node._collapsed && node.children) node.children.forEach(c=>collectVisible(c, arr, links, node));
}

function render(){
  rowCursor = 0;
  layout(DATA);

  const nodes=[], links=[];
  collectVisible(DATA, nodes, links, null);

  // clear
  world.querySelectorAll('.node').forEach(n=>n.remove());
  svg.innerHTML='';

  // bounds
  let maxX=0, maxY=0, minY=Infinity;
  nodes.forEach(n=>{ maxX=Math.max(maxX,n.x); maxY=Math.max(maxY,n.y); minY=Math.min(minY,n.y); });
  const padTop = 40 - minY; // shift so top row isn't clipped
  svg.style.width = (maxX + COL_W) + 'px';
  svg.style.height = (maxY + padTop + 80) + 'px';

  // links (bezier)
  links.forEach(([p,c])=>{
    const x1=p.x + nodeHalfWidth(p), y1=p.y + padTop;
    const x2=c.x, y2=c.y + padTop;
    const mx=(x1+x2)/2;
    const d=`M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`;
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d',d); path.setAttribute('class','link');
    svg.appendChild(path);
  });

  // nodes
  nodes.forEach(n=>{
    const el=document.createElement('div');
    const lvl=Math.min(n.depth,4);
    el.className='node lvl'+lvl + (n._collapsed && n.children ? ' collapsed':'');
    el.style.left = n.x + 'px';
    el.style.top  = (n.y + padTop) + 'px';

    let html='';
    if(n.children){
      const sign = n._collapsed ? '+' : '−';
      html += `<span class="toggle">${sign}</span>`;
    }
    html += `<span class="label">${escapeHtml(n.name)}</span>`;
    if(n.i){ html += `<span class="info">${escapeHtml(n.i)}</span>`; }
    el.innerHTML = html;

    el.addEventListener('click',(e)=>{
      e.stopPropagation();
      if(n.children){
        n._collapsed=!n._collapsed;
        render();
      }else if(n.i){
        el.classList.toggle('show-info');
      }
    });
    world.appendChild(el);
  });

  // stash width after DOM for next link calc pass
  requestAnimationFrame(()=>{ nodes.forEach(n=>{ /* noop, widths cached via estimate */ }); });
}

/* estimate half-width for link start (root/level nodes are wider) */
function nodeHalfWidth(n){
  const est = Math.min(n.name.length*7.2 + 46, 300);
  return est; // full width approx from left edge to right edge
}

function escapeHtml(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ============================================================
   PAN + ZOOM
   ============================================================ */
let scale=1, tx=40, ty=20;
function applyTransform(){ world.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`; }

let dragging=false, sx=0, sy=0, stx=0, sty=0;
stage.addEventListener('mousedown',e=>{
  if(e.target.closest('.node')) return;
  dragging=true; stage.classList.add('grabbing');
  sx=e.clientX; sy=e.clientY; stx=tx; sty=ty;
});
window.addEventListener('mousemove',e=>{
  if(!dragging)return;
  tx=stx+(e.clientX-sx); ty=sty+(e.clientY-sy); applyTransform();
});
window.addEventListener('mouseup',()=>{dragging=false; stage.classList.remove('grabbing');});

stage.addEventListener('wheel',e=>{
  e.preventDefault();
  const rect=stage.getBoundingClientRect();
  const mx=e.clientX-rect.left, my=e.clientY-rect.top;
  const factor= e.deltaY<0 ? 1.12 : 1/1.12;
  const ns=Math.min(2.2, Math.max(0.25, scale*factor));
  // zoom toward cursor
  tx = mx - (mx - tx)*(ns/scale);
  ty = my - (my - ty)*(ns/scale);
  scale=ns; applyTransform();
},{passive:false});

/* fit whole map to screen */
function fit(){
  const b=svg.getBoundingClientRect();
  const w=svg.offsetWidth||1, h=svg.offsetHeight||1;
  const availW=stage.clientWidth-60, availH=stage.clientHeight-60;
  scale=Math.min(availW/w, availH/h, 1);
  tx=30; ty=(stage.clientHeight - h*scale)/2;
  if(ty<20) ty=20;
  applyTransform();
}

/* ============================================================
   CONTROLS
   ============================================================ */
function setAll(node, collapsed){
  if(node.children){ node._collapsed=collapsed; node.children.forEach(c=>setAll(c,collapsed)); }
}
document.getElementById('expandBtn').onclick=()=>{ setAll(DATA,false); DATA._collapsed=false; render(); };
document.getElementById('collapseBtn').onclick=()=>{ DATA.children.forEach(c=>setAll(c,true)); DATA._collapsed=false; render(); };
document.getElementById('resetBtn').onclick=()=>{ location.reload(); };
document.getElementById('zoomIn').onclick=()=>{ scale=Math.min(2.2,scale*1.15); applyTransform(); };
document.getElementById('zoomOut').onclick=()=>{ scale=Math.max(0.25,scale/1.15); applyTransform(); };
document.getElementById('fit').onclick=fit;

render();
applyTransform();
</script>
</body>
</html>
